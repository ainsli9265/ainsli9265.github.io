<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title> hw 2 </title>
        <style>
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                margin: 0;
                transition: background-color 0.3s ease;
            }
            .label {
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                font-size: 2rem;
            }
            select {
                font-size:  1.5rem;
            }
        </style>
    </head>
    
    <body>
        <div>
            <span class="label">waveform: </span>
            <select id="waveform">
                <option value="sine" selected="selected">sine</option>
                <option value="sawtooth">sawtooth</option>
            </select>
        </div>

        <div>
            <span class="label">additive synthesis: </span>
            <select id="additive">
                <option value="off" selected="selected">off</option>
                <option value="on">on</option>
            </select>
        </div>

        <div>
            <span class="label">am synthesis: </span>
            <select id="am">
                <option value="off" selected="selected">off</option>
                <option value="on">on</option>
            </select>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <span class="label">am frequency:</span>
            <input type="range" id="amfreq" min="1" max="500" step="1" value="110">
        </div>

        <div>
            <span class="label">fm synthesis: </span>
            <select id="fm">
                <option value="off" selected="selected">off</option>
                <option value="on">on</option>
            </select>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <span class="label">fm frequency:</span>
            <input type="range" id="fmfreq" min="1" max="500" step="1" value="110">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <span class="label">fm modulation index:</span>
            <input type="range" id="fmindex" min="1" max="500" step="1" value="100">
        </div>
    
        <div>
            <span class="label">lfo (doesn't work with additive synthesis): </span>
            <select id="lfo">
                <option value="off" selected="selected">off</option>
                <option value="on">on</option>
            </select>
        </div>

        <div>
            <span class="label">current note:</span>
            <span id="notedisplay">-</span>
        </div>

        <div class="container">
            <canvas id="globalVisualizer" width="150" height="85" style="border:2px solid">
                wave form visualizer
            </canvas>
        </div>
    </body>
    <script src="main.js"> </script>
</html>
